[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notion-calendar-sync"
version = "3.1.0"
requires-python = ">=3.12"
dependencies = [
    "ics",
    "python-dotenv",
    "requests",
    "google-api-python-client",
    "google-auth",
    "google-auth-oauthlib",
]

[tool.setuptools.packages.find]
where = ["src"]
